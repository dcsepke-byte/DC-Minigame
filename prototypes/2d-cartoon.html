<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Party Arena — 2D Weltkarte Prototyp</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; font-family:'Baloo 2','Comic Sans MS',system-ui,sans-serif; touch-action:none; }
  body { background:#3a6e2a; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; z-index:5; }
  .logo { font-size:22px; font-weight:900; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.5); letter-spacing:1px; }
  .logo span { color:#ffe14d; }
  .round-badge { background:rgba(255,255,255,.9); color:#2b6ea8; font-weight:800; font-size:13px; padding:6px 14px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .board-wrap { flex:1; position:relative; margin:0 8px; overflow:hidden; border-radius:24px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  canvas#board { width:100%; height:100%; display:block; }
  footer { display:flex; align-items:center; gap:12px; padding:12px 16px calc(14px + env(safe-area-inset-bottom)); z-index:5; }
  .dice-btn { width:72px; height:72px; border-radius:18px; border:none; font-size:38px; background:linear-gradient(145deg,#fff,#e8e8f0); box-shadow:0 6px 20px rgba(0,0,0,.3), inset 0 -3px 0 rgba(0,0,0,.12); cursor:pointer; transition:transform .1s; flex-shrink:0; display:grid; place-items:center; }
  .dice-btn:active { transform:scale(.92); }
  .turn-info { flex:1; }
  .players-row { display:flex; gap:6px; }
  .pchip { display:flex; align-items:center; gap:5px; background:rgba(255,255,255,.3); padding:4px 10px; border-radius:14px; color:#fff; font-weight:700; font-size:12px; }
  .pchip.active { background:rgba(255,255,255,.9); color:#2b6ea8; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .msg { font-size:13px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6); margin-top:2px; }
  .hint { position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:11px; color:rgba(255,255,255,.95); text-shadow:0 1px 2px rgba(0,0,0,.6); z-index:4; pointer-events:none; }
  #loading { position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-weight:700; background:#3a6e2a; z-index:20; }
</style>
</head>
<body>
  <header><div class="logo">PARTY<span>ARENA</span></div><div class="round-badge">Runde 1</div></header>
  <div class="board-wrap"><canvas id="board"></canvas><div id="loading">Lade Weltkarte…</div><div class="hint">🖐 Ziehen zum Verschieben · 🔍 Pinchen zum Zoomen</div></div>
  <footer>
    <button class="dice-btn" id="diceBtn">🎲</button>
    <div class="turn-info">
      <div class="players-row"><span class="pchip" id="chip1">🧱 Brix</span><span class="pchip" id="chip2">🐟 Nixie</span></div>
      <div class="msg" id="msg">Tippe den Würfel!</div>
    </div>
  </footer>
<script>
const ARENIANS=[
  {id:'brix',emoji:'🧱',name:'Brix',color:'#ff6a00'},
  {id:'nixie',emoji:'🐟',name:'Nixie',color:'#00f0ff'}
];

/* =========================================================
   GROSSE DETAILLIERTE WELTKARTE (Kenney CC0 Tiny Town als Basis)
   Wegenetz mit vielen Feldern + klar markierten Verzweigungen.
   Karte: ../assets/kenney-tiny-town/world_base.png (812x744)
   ========================================================= */
const MAP = { img:null, w:812, h:744 };

// Kartengraph: Felder in Karten-Koordinaten (0..812, 0..744)
const F=[];
function addF(x,y,type,next){const i=F.length;F.push({idx:i,x,y,type,next:next||[]});return i;}
(function(){
  // Zitadelle (Start, unten links beim Schloss)
  const s=addF(110,620,'start');
  // Hauptstraße nach Osten
  const a=addF(200,600,'normal');
  const b=addF(290,580,'shop');
  const c=addF(380,560,'normal');
  // VERZWEIGUNG 1: nach Norden (Wald/Berg) oder weiter Osten
  const c_n=addF(380,470,'star');
  const c_e=addF(470,560,'normal');
  const d=addF(560,540,'lucky');
  const e=addF(650,520,'normal');
  const f=addF(740,500,'star');
  const g=addF(760,420,'normal');
  // Nord-Pfad (vom c_n): über den Wald
  const n1=addF(430,400,'normal');
  const n2=addF(500,330,'star');
  const n3=addF(580,280,'normal');
  const n4=addF(660,240,'shop');
  const n5=addF(700,170,'lucky');
  // VERZWEIGUNG 2: vom n3 nach Südosten ODER weiter Norden
  const n3_se=addF(640,340,'normal');
  const n3_n=addF(540,220,'normal');
  // Süd-Pfad (Seen)
  const s1=addF(220,450,'normal');
  const s2=addF(260,360,'lucky');
  const s3=addF(340,300,'normal');
  const s4=addF(420,240,'star');
  const s5=addF(500,180,'shop');
  // VERZWEIGUNG 3: vom s5 nach Osten (Berg) oder Westen (zurück)
  const s5_e=addF(580,160,'normal');
  const s5_w=addF(420,120,'normal');
  // West-See-Pfad
  const w1=addF(340,110,'normal');
  const w2=addF(280,60,'star');
  // Verbindungen
  F[s].next=[a];
  F[a].next=[b];F[b].next=[c];
  F[c].next=[c_n,c_e];        // ← VERZWEIGUNG 1
  F[c_n].next=[n1];F[n1].next=[n2];F[n2].next=[n3];
  F[n3].next=[n3_se,n3_n];    // ← VERZWEIGUNG 2
  F[n3_se].next=[n4];F[n4].next=[n5];
  F[n3_n].next=[w2];F[w2].next=[w1];
  F[c_e].next=[d];F[d].next=[e];F[e].next=[f];F[f].next=[g];
  // Süd
  F[s].next.push(s1);         // auch südlicher Ausgang vom Start
  F[s1].next=[s2];F[s2].next=[s3];F[s3].next=[s4];F[s4].next=[s5];
  F[s5].next=[s5_e,s5_w];     // ← VERZWEIGUNG 3
  F[s5_e].next=[n5];          // trifft Nordpfad
  F[s5_w].next=[w1];
  F[w1].next=[w2];
})();
const TILE_COUNT=F.length;
const TYPE_ICON={start:'🏁',star:'⭐',lucky:'🍀',shop:'🛒',normal:''};
const TYPE_COLOR={start:'#ffe14d',star:'#fff3b0',lucky:'#c9f7a8',shop:'#a8e4f7',normal:'#f7f0dc'};

let players=[{id:'brix',char:ARENIANS[0],pos:0,moving:null},{id:'nixie',char:ARENIANS[1],pos:10,moving:null}];
let turn=0,diceRolling=false;

const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
let cam={x:0,y:0,z:0.62};
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);const r=canvas.parentElement.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);
let dragging=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(dragging){cam.x+=(e.clientX-lx)/cam.z;cam.y+=(e.clientY-ly)/cam.z;lx=e.clientX;ly=e.clientY;}});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.3,Math.min(1.6,cam.z*(e.deltaY<0?1.12:.9)));},{passive:false});
let pinch=0;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);cam.z=Math.max(.3,Math.min(1.6,cam.z*(d/pinch)));pinch=d;e.preventDefault();}},{passive:false});

document.getElementById('diceBtn').addEventListener('click',()=>{
  if(diceRolling)return;
  const roll=1+Math.floor(Math.random()*6);
  const p=players[turn];
  const path=[p.pos];let cur=p.pos;
  for(let s=0;s<roll;s++){const nxt=F[cur].next;if(!nxt||!nxt.length)break;cur=nxt[0];path.push(cur);}
  p.moving={from:p.pos,to:cur,path,steps:path.length-1,t:0};
  diceRolling=true;setMsg(p.char.name+' würfelt '+roll+'…',p.char.color);animateDice(roll);
});
function animateDice(roll){const b=document.getElementById('diceBtn');let n=0;const s=setInterval(()=>{b.textContent=[1,2,3,4,5,6][n++%6];},90);setTimeout(()=>{clearInterval(s);b.textContent='🎲';},900);}
function setMsg(t,c){const e=document.getElementById('msg');e.textContent=t;e.style.color=c||'';}
function updateChips(){document.getElementById('chip1').classList.toggle('active',turn===0);document.getElementById('chip2').classList.toggle('active',turn===1);}
function updateMove(dt){
  let allDone=true;
  players.forEach(p=>{if(!p.moving)return;allDone=false;p.moving.t=Math.min(1,p.moving.t+dt*1.2/Math.max(1,p.moving.steps));p.pos=p.moving.from+(p.moving.to-p.moving.from)*p.moving.t;if(p.moving.t>=1)p.moving=null;});
  if(allDone&&diceRolling){diceRolling=false;const w=turn;turn=(turn+1)%2;updateChips();setMsg(players[w].char.name+' zieht '+Math.round(players[w].pos)+'. '+players[turn].char.name+' ist dran!',players[w].char.color);}
}
function lighten(hex,amt){const n=parseInt(hex.slice(1),16);return `rgb(${Math.min(255,(n>>16)+amt)},${Math.min(255,((n>>8)&255)+amt)},${Math.min(255,(n&255)+amt)})`;}

/* --- Wege (Trampelpfade) über die Karte --- */
function drawEdges(){
  ctx.lineCap='round';ctx.lineJoin='round';
  F.forEach(f=>{
    (f.next||[]).forEach(ni=>{
      const t=F[ni];
      ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(t.x,t.y);
      ctx.lineWidth=30;ctx.strokeStyle='rgba(90,70,40,.25)';ctx.stroke();
      ctx.lineWidth=22;ctx.strokeStyle='#d8c896';ctx.stroke();
    });
  });
}

/* --- Felder --- */
function drawTiles(){
  F.forEach(f=>{
    const isJunction=f.next.length>1;
    const r=isJunction?30:24;
    ctx.beginPath();ctx.arc(f.x+3,f.y+4,r,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.3)';ctx.fill();
    const g=ctx.createRadialGradient(f.x-r*.3,f.y-r*.3,r*.2,f.x,f.y,r);
    g.addColorStop(0,'#fff');g.addColorStop(.5,TYPE_COLOR[f.type]);g.addColorStop(1,'#d8c8a0');
    ctx.beginPath();ctx.arc(f.x,f.y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    ctx.lineWidth=isJunction?5:4;ctx.strokeStyle='#fff';ctx.stroke();
    if(isJunction){ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🛣',f.x,f.y+1);}
    else if(TYPE_ICON[f.type]){ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(TYPE_ICON[f.type],f.x,f.y+1);}
    else{ctx.font='700 11px "Baloo 2",sans-serif';ctx.fillStyle='rgba(80,60,30,.7)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.idx+1,f.x,f.y+1);}
  });
}
function drawPlayers(){
  players.forEach(p=>{
    const idx=Math.max(0,Math.min(TILE_COUNT-1,Math.round(p.pos)));
    const f=F[idx];
    const hop=p.moving?Math.sin(p.moving.t*Math.PI)*20:0;
    ctx.beginPath();ctx.ellipse(f.x,f.y+24,20,8,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fill();
    ctx.beginPath();ctx.arc(f.x,f.y-hop,26,0,Math.PI*2);
    const g=ctx.createRadialGradient(f.x-8,f.y-hop-8,3,f.x,f.y-hop,28);
    g.addColorStop(0,lighten(p.char.color,50));g.addColorStop(1,p.char.color);
    ctx.fillStyle=g;ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle='rgba(0,0,0,.3)';ctx.stroke();
    ctx.font='26px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.char.emoji,f.x,f.y-hop+1);
  });
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(W/2+cam.x*cam.z,H/2+cam.y*cam.z);ctx.scale(cam.z,cam.z);
  if(MAP.img){
    // Weltkarte zentriert
    ctx.drawImage(MAP.img,-MAP.w/2,-MAP.h/2,MAP.w,MAP.h);
    // leichte Vignette/Overlay für Lesbarkeit
    ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(-MAP.w/2,-MAP.h/2,MAP.w,MAP.h);
  }
  drawEdges();
  drawTiles();
  drawPlayers();
  ctx.restore();
}
let last=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000||.016);last=t;updateMove(dt);draw();requestAnimationFrame(loop);}

// Karte laden
const img=new Image();
img.onload=()=>{MAP.img=img;document.getElementById('loading').style.display='none';resize();updateChips();setMsg('Tippe den Würfel! 🎲');requestAnimationFrame(loop);};
img.onerror=()=>{document.getElementById('loading').textContent='Karte fehlt — laufe ohne';resize();updateChips();requestAnimationFrame(loop);};
img.src='../assets/kenney-tiny-town/world_base_bright.png';
</script>
</body>
</html>
