<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Party Arena — Gebiet: Wald + Stadt</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; font-family:'Baloo 2','Comic Sans MS',system-ui,sans-serif; touch-action:none; }
  body { background:#2f4f2f; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; z-index:5; }
  .logo { font-size:22px; font-weight:900; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.5); letter-spacing:1px; }
  .logo span { color:#ffe14d; }
  .round-badge { background:rgba(255,255,255,.9); color:#2b6ea8; font-weight:800; font-size:13px; padding:6px 14px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .board-wrap { flex:1; position:relative; margin:0 8px; overflow:hidden; border-radius:24px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  canvas#board { width:100%; height:100%; display:block; }
  footer { display:flex; align-items:center; gap:12px; padding:12px 16px calc(14px + env(safe-area-inset-bottom)); z-index:5; }
  .dice-btn { width:72px; height:72px; border-radius:18px; border:none; font-size:38px; background:linear-gradient(145deg,#fff,#e8e8f0); box-shadow:0 6px 20px rgba(0,0,0,.3), inset 0 -3px 0 rgba(0,0,0,.12); cursor:pointer; transition:transform .1s; flex-shrink:0; display:grid; place-items:center; }
  .dice-btn:active { transform:scale(.92); }
  .turn-info { flex:1; }
  .players-row { display:flex; gap:6px; }
  .pchip { display:flex; align-items:center; gap:5px; background:rgba(255,255,255,.3); padding:4px 10px; border-radius:14px; color:#fff; font-weight:700; font-size:12px; }
  .pchip.active { background:rgba(255,255,255,.9); color:#2b6ea8; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .msg { font-size:13px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6); margin-top:2px; }
  .hint { position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:11px; color:rgba(255,255,255,.95); text-shadow:0 1px 2px rgba(0,0,0,.6); z-index:4; pointer-events:none; }
  #loading { position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-weight:700; background:#2f4f2f; z-index:20; }
</style>
</head>
<body>
  <header><div class="logo">PARTY<span>ARENA</span></div><div class="round-badge">Wald + Stadt</div></header>
  <div class="board-wrap"><canvas id="board"></canvas><div id="loading">Baue Gebiet…</div><div class="hint">🖐 Ziehen zum Verschieben · 🔍 Pinchen zum Zoomen</div></div>
  <footer>
    <button class="dice-btn" id="diceBtn">🎲</button>
    <div class="turn-info">
      <div class="players-row"><span class="pchip" id="chip1">🧱 Brix</span><span class="pchip" id="chip2">🐟 Nixie</span></div>
      <div class="msg" id="msg">Tippe den Würfel!</div>
    </div>
  </footer>
<script>
const ARENIANS=[
  {id:'brix',emoji:'🧱',name:'Brix',color:'#ff6a00'},
  {id:'nixie',emoji:'🐟',name:'Nixie',color:'#00f0ff'}
];

/* =========================================================
   ERSTES GEBIET: Wald + Stadt (aus den 136 Kenney-Blöcken).
   Ein Gebiet = ein zusammenhängendes Block-Grid (hier 40x40).
   Landschaft: Stadt (Häuser) im Osten, Wald (Bäume) im Westen,
   Weg verbindet beide, Felder liegen auf dem Weg.
   ========================================================= */
const TS=16;  // Tile-Größe
const GW=40, GH=40;

// Tile-Bilder
const tileCache={};
const NEED_TILES=[0,1,2,3,4,5,15,16,18,20,25,27,28,29,30,31,32,48,49,50,51,52,53,54,55,60,61,62,63,64,65,66,67,72,73,74,75,44,45,46,47,56,57,58,59,68,69,70,71];
function loadTiles(cb){
  let loaded=0;
  NEED_TILES.forEach(id=>{
    const img=new Image();
    img.onload=()=>{tileCache[id]=img;if(++loaded===NEED_TILES.length)cb();};
    img.onerror=()=>{if(++loaded===NEED_TILES.length)cb();};
    img.src='../assets/kenney-tiny-town/tiles/tile_'+String(id).padStart(4,'0')+'.png';
  });
}

let ground=[];  // ground[y][x] = Gras-Tile (0,1,2)
let decor=[];   // decor[y][x] = Objekt-Tile (Bäume, Häuser) oder 0
let road=[];    // road[y][x] = true wenn Weg
let waypoints=[];  // [{x,y,type}] Felder auf dem Weg

function inBounds(x,y){return x>=0&&x<GW&&y>=0&&y<GH;}
function setRoad(x,y){if(inBounds(x,y))road[y][x]=true;}
function setDeco(x,y,t){if(inBounds(x,y)&&!road[y][x])decor[y][x]=t;}

function buildArea(){
  // Grund: Gras
  ground=[];decor=[];road=[];
  for(let y=0;y<GH;y++){
    ground[y]=[];decor[y]=[];road[y]=[];
    for(let x=0;x<GW;x++){
      const r=(x*7+y*13)%11;
      ground[y][x]= r<5?0 : r<8?1 : 2;
      decor[y][x]=0;road[y][x]=false;
    }
  }

  // --- WALD (Westen, x=2..18) ---
  // Dichte Bäume, lückig gemustert
  for(let y=3;y<GH-3;y++){
    for(let x=2;x<19;x++){
      if(road[y][x])continue;
      // Baum-Muster: große + kleine Bäume
      const h=(x*3+y*5)%7;
      if(h===0) decor[y][x]= (y%2===0?4:3);        // grüne/gelbe große Krone
      else if(h===1) decor[y][x]= (x%2===0?28:27); // kleine Bäume
      else if(h===2) decor[y][x]=29;               // Pilze
      // Baum-Körper unter den großen Kronen
      if(h===0 && y+1<GH) decor[y+1][x]=(y%2===0?16:15);
    }
  }
  // Waldlichtung mit Blumen
  decor[12][8]=1; decor[13][9]=2;

  // --- STADT (Osten, x=22..38) ---
  // Häuser in Reihen (Stein grau + braun)
  const houses=[
    {bx:23,by:6, stone:true},
    {bx:27,by:6, stone:false},
    {bx:31,by:6, stone:true},
    {bx:35,by:6, stone:false},
    {bx:23,by:11, stone:false},
    {bx:27,by:11, stone:true},
    {bx:31,by:11, stone:false},
    {bx:35,by:11, stone:true},
  ];
  houses.forEach(h=>{
    const bx=h.bx, by=h.by;
    if(!inBounds(bx+2,by+2))return;
    const D=h.stone?{top:[48,49,50],mid:[60,61,62],fac:[72,74,75]}:{top:[52,53,54],mid:[64,65,66],fac:[72,74,75].map(t=>t)};
    decor[by][bx]=D.top[0]; decor[by][bx+1]=D.top[1]; decor[by][bx+2]=D.top[2];
    decor[by+1][bx]=D.mid[0]; decor[by+1][bx+1]=D.mid[1]; decor[by+1][bx+2]=D.mid[2];
    decor[by+2][bx]=72; decor[by+2][bx+1]=74; decor[by+2][bx+2]=75;
  });

  // --- WEG: verbindet Wald + Stadt (S-Kurve) ---
  // horizontaler Hauptweg in der Mitte (y=20)
  const midY=20;
  for(let x=3;x<GW-3;x++)setRoad(x,midY);
  // vertikale Anbindungen
  for(let y=midY;y<GH-2;y++)setRoad(19,y);   // nach Süden
  for(let y=3;y<midY;y++)setRoad(24,y);      // nach Norden durch die Stadt

  // --- FELDER auf dem Weg ---
  waypoints=[];
  const types=['start','normal','lucky','star','shop','normal','lucky','star','normal','shop','normal','start'];
  let ti=0;
  // Hauptweg (x von 3 bis 36, jede 3)
  for(let x=5;x<38;x+=3){waypoints.push({x,y:midY,type:types[ti%types.length]});ti++;}
  // Verzweigung Süd
  for(let y=22;y<GH-2;y+=3){waypoints.push({x:19,y,type:'normal'});}
  // Verzweigung Nord (durch Stadt)
  for(let y=midY-3;y>3;y-=3){waypoints.push({x:24,y,type:ti%3===0?'star':'lucky'});}
}

// Spieler
let players=[
  {id:'brix',char:ARENIANS[0],wp:0,moving:null},
  {id:'nixie',char:ARENIANS[1],wp:4,moving:null}
];
let turn=0,diceRolling=false;

const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
let cam={x:-GW*TS/2,y:-GH*TS/2,z:0.6};
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);const r=canvas.parentElement.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);
let dragging=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(dragging){cam.x+=(e.clientX-lx)/cam.z;cam.y+=(e.clientY-ly)/cam.z;lx=e.clientX;ly=e.clientY;}});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.3,Math.min(3,cam.z*(e.deltaY<0?1.15:.87)));},{passive:false});
let pinch=0;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);cam.z=Math.max(.3,Math.min(3,cam.z*(d/pinch)));pinch=d;e.preventDefault();}},{passive:false});

document.getElementById('diceBtn').addEventListener('click',()=>{
  if(diceRolling)return;
  const roll=1+Math.floor(Math.random()*6);
  const p=players[turn];
  p.moving={from:p.wp,to:Math.min(waypoints.length-1,p.wp+roll),steps:roll,t:0};
  diceRolling=true;setMsg(p.char.name+' würfelt '+roll+'…',p.char.color);animateDice(roll);
});
function animateDice(roll){const b=document.getElementById('diceBtn');let n=0;const s=setInterval(()=>{b.textContent=[1,2,3,4,5,6][n++%6];},90);setTimeout(()=>{clearInterval(s);b.textContent='🎲';},900);}
function setMsg(t,c){const e=document.getElementById('msg');e.textContent=t;e.style.color=c||'';}
function updateChips(){document.getElementById('chip1').classList.toggle('active',turn===0);document.getElementById('chip2').classList.toggle('active',turn===1);}
function updateMove(dt){
  let allDone=true;
  players.forEach(p=>{if(!p.moving)return;allDone=false;p.moving.t=Math.min(1,p.moving.t+dt*1.2/Math.max(1,p.moving.steps));if(p.moving.t>=1){p.wp=p.moving.to;p.moving=null;}});
  if(allDone&&diceRolling){diceRolling=false;const w=turn;turn=(turn+1)%2;updateChips();setMsg(players[w].char.name+' zieht '+Math.round(players[w].wp)+'. '+players[turn].char.name+' ist dran!',players[w].char.color);}
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(W/2+cam.x*cam.z,H/2+cam.y*cam.z);ctx.scale(cam.z,cam.z);
  ctx.fillStyle='#3a5a3a';ctx.fillRect(-TS,-TS,GW*TS+TS*2,GH*TS+TS*2);
  // Gras
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const g=ground[y][x];
    const img=tileCache[g];
    if(img)ctx.drawImage(img,x*TS,y*TS,TS,TS);
  }
  // Weg
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    if(road[y][x]){
      ctx.fillStyle='#d8b878';ctx.fillRect(x*TS,y*TS,TS,TS);
      ctx.fillStyle='rgba(0,0,0,.1)';ctx.fillRect(x*TS,y*TS,TS,2);
    }
  }
  // Deko (Bäume, Häuser)
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const d=decor[y][x];
    if(d>0){const img=tileCache[d];if(img)ctx.drawImage(img,x*TS,y*TS,TS,TS);}
  }
  // Gebiets-Labels
  ctx.font='700 22px "Baloo 2",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=3;
  ctx.strokeText('🌲 WALD',10*TS,3*TS);ctx.fillText('🌲 WALD',10*TS,3*TS);
  ctx.strokeText('🏙️ STADT',30*TS,3*TS);ctx.fillText('🏙️ STADT',30*TS,3*TS);
  // Felder
  waypoints.forEach(wp=>{
    const cx=wp.x*TS+TS/2, cy=wp.y*TS+TS/2;
    ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);
    ctx.fillStyle=wp.type==='star'?'#ffe14d':wp.type==='lucky'?'#7bd94e':wp.type==='shop'?'#5ec8f0':wp.type==='start'?'#ff6a6a':'#fff';
    ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.stroke();
  });
  // Figuren
  players.forEach(p=>{
    const wp=waypoints[Math.max(0,Math.min(waypoints.length-1,p.wp))];
    const cx=wp.x*TS+TS/2, cy=wp.y*TS+TS/2;
    const hop=p.moving?Math.sin(p.moving.t*Math.PI)*10:0;
    ctx.beginPath();ctx.arc(cx,cy-hop,10,0,Math.PI*2);
    ctx.fillStyle=p.char.color;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='rgba(0,0,0,.3)';ctx.stroke();
    ctx.font='15px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.char.emoji,cx,cy-hop);
  });
  ctx.restore();
}
let last=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000||.016);last=t;updateMove(dt);draw();requestAnimationFrame(loop);}
resize();buildArea();updateChips();
loadTiles(()=>{document.getElementById('loading').style.display='none';setMsg('Tippe den Würfel! 🎲');requestAnimationFrame(loop);});
</script>
</body>
</html>
