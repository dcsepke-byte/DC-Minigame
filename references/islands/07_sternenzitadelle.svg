<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="sky7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="50%" stop-color="#311b92"/>
      <stop offset="100%" stop-color="#4527a0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffca28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#sky7)" rx="24"/>
  <circle cx="80" cy="80" r="4" fill="#fff" opacity="0.8"/>
  <circle cx="320" cy="120" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="250" cy="60" r="5" fill="#fff" opacity="0.7"/>
  <circle cx="360" cy="200" r="3" fill="#fff" opacity="0.5"/>
  <ellipse cx="200" cy="380" rx="150" ry="50" fill="url(#gold)" filter="url(#shadow)"/>
  <path d="M150 380 L170 300 L230 300 L250 380 Z" fill="#ffd34e" filter="url(#shadow)"/>
  <path d="M170 300 L200 270 L230 300 Z" fill="#ffecb3"/>
  <circle cx="200" cy="270" r="12" fill="#ffd34e" filter="url(#glow)"/>
  <path d="M120 380 Q200 365 280 380" stroke="#ff8f00" stroke-width="4" fill="none"/>
  <rect x="20" y="420" width="360" height="60" rx="16" fill="#fff" opacity="0.9"/>
  <text x="200" y="453" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1a2e">7 · Sternenzitadelle</text>
  <text x="200" y="476" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4a4a5a">Gold · Tiefblau · Magenta · Finale + Endgame</text>
</svg>
